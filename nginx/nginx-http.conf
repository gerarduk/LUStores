events {
    worker_connections 1024;
}

http {
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # DNS resolver for dynamic upstream resolution
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    upstream app {
        server app:5000 max_fails=3 fail_timeout=30s weight=1;
        keepalive 32;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

    # HTTP server - for certificate generation and HTTP-only mode
    server {
        listen 80;
        server_name _;
        
        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        # Health check endpoint with improved error handling
        location /health {
            proxy_pass http://app/health;
            proxy_connect_timeout 5s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
            proxy_set_header X-Forwarded-Proto http;
            access_log off;
            
            # Custom error handling for health checks
            error_page 502 503 504 = @health_fallback;
        }

        # Fallback for health check failures
        location @health_fallback {
            return 200 "nginx healthy - app unavailable\n";
            add_header Content-Type text/plain;
        }

        # Internal nginx status endpoint for health checks
        location = /nginx-health {
            access_log off;
            return 200 "nginx healthy\n";
            add_header Content-Type text/plain;
        }
        
        client_max_body_size 50M;
        
        # Proxy settings with timeouts
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        
        # Connection timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 30s;
        
        # Retry configuration
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;

        # Static assets - proxy to app backend (assets are built into the app container)
        location /assets/ {
            proxy_pass http://app;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # API routes with enhanced timeout for complex queries
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://app;
            
            # Temporarily disabled error masking for debugging production issues
            # error_page 502 503 504 = @api_error;
            # proxy_intercept_errors on;
            
            # Increase timeout for complex queries like enhanced suppliers
            proxy_read_timeout 60s;
        }

        # Auth routes with stricter rate limiting
        location /auth/ {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://app;
            
            # Temporarily disabled error masking for debugging production issues
            # error_page 502 503 504 = @api_error;
            # proxy_intercept_errors on;
        }

        # WebSocket support for Vite HMR (development)
        location /ws {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # All static files with caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://app;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # Main application with React SPA support
        location / {
            proxy_pass http://app;
            
            # React SPA fallback - serve index.html for non-API routes
            error_page 404 = @react_fallback;
        }

        # React SPA fallback - serve index.html for client-side routing
        location @react_fallback {
            rewrite ^ / break;
            proxy_pass http://app;
            proxy_intercept_errors off;
        }
    }
}
