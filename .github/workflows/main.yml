                          <div class="description">Auto-generated TypeScript API documentation</div>
                      </a>
                      <a href="../index.html" class="report-link">
                          🏠 Main Documentation
                          <div class="description">Complete project documentation</div>
                      </a>
                  </div>
              </div>
          </body>
          </html>
          EOF

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v6
        with:
          name: documentation
          path: docs/_build/html/
          retention-days: 1

      
   
