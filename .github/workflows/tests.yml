env:
  NODE_VERSION: '24'
  POSTGRES_VERSION: '15'

jobs:
  lint-and-type-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Type check
        run: |
          echo "Running TypeScript type check..."
          npm run check || echo "Type check completed with issues"

      - name: Lint
        run: |
          echo "Checking for lint script..."
          if npm run lint --dry-run > /dev/null 2>&1; then
            echo "Running lint..."
            npm run lint || echo "Lint completed with issues"
          else
            echo "No lint script found, skipping..."
          fi

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_inventory
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Setup test database
        run: |
          # Install PostgreSQL client
          sudo apt-get update && sudo apt-get install -y postgresql-client

          # Wait for PostgreSQL
          timeout 30 bash -c 'until pg_isready -h localhost -p 5432 -U postgres; do sleep 2; done'

          # Initialize schema if init.sql exists
          if [ -f "init.sql" ]; then
            PGPASSWORD=password psql -h localhost -p 5432 -U postgres -d test_inventory -f init.sql
          fi
        env:
          PGPASSWORD: password

      - name: Run unit tests
        run: |
          echo "Running unit tests..."
          npm run test:ci || npm test || echo "Tests completed with some failures"
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:password@localhost:5432/test_inventory
          SESSION_SECRET: test-secret-key

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Run npm audit
        run: |
          npm audit --audit-level=moderate --json > npm-audit.json || true
          npm audit --audit-level critical || echo "Critical vulnerabilities found"
        continue-on-error: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Upload security scan results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: security-scan-results
          path: |
            npm-audit.json
            trivy-results.sarif
          retention-days: 7
