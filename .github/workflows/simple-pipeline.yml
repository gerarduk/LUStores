name: Tests & Deployment

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      deploy_env:
        description: 'Environment to deploy'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - staging
          - production

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_inventory
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v6
      
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup test database
        run: |
          sudo apt-get install -y postgresql-client
          timeout 30 bash -c 'until pg_isready -h localhost -p 5432 -U postgres; do sleep 2; done'
          if [ -f "init.sql" ]; then
            PGPASSWORD=password psql -h localhost -p 5432 -U postgres -d test_inventory -f init.sql
          fi
        env:
          PGPASSWORD: password

      - name: Run linting
        run: |
          if npm run lint --dry-run > /dev/null 2>&1; then
            npm run lint
          else
            echo "No lint script found"
          fi

      - name: Run type check
        run: |
          if npm run check --dry-run > /dev/null 2>&1; then
            npm run check
          else
            echo "No type check script found"
          fi

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/test_inventory
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

      - name: Upload coverage
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_inventory_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

    steps:
      - uses: actions/checkout@v6
      
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Setup test database
        run: |
          sudo apt-get install -y postgresql-client
          timeout 30 bash -c 'until pg_isready -h localhost -p 5433 -U postgres; do sleep 2; done'
          if [ -f "init.sql" ]; then
            PGPASSWORD=password psql -h localhost -p 5433 -U postgres -d test_inventory_e2e -f init.sql
          fi
        env:
          PGPASSWORD: password

      - name: Start application
        run: |
          npm start &
          echo $! > server.pid
          timeout 60 bash -c 'until curl -s http://localhost:5001/health > /dev/null 2>&1 || curl -s http://localhost:5001 > /dev/null 2>&1; do sleep 2; done'
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5433/test_inventory_e2e
          NODE_ENV: test
          PORT: 5001

      - name: Run E2E tests
        run: npx playwright test
        env:
          BASE_URL: http://localhost:5001

      - name: Stop application
        if: always()
        run: |
          if [ -f "server.pid" ]; then
            kill $(cat server.pid) || true
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level=moderate

      - name: Run dependency check
        run: |
          if command -v trivy &> /dev/null; then
            trivy fs --severity HIGH,CRITICAL .
          else
            echo "Trivy not available, skipping advanced security scan"
          fi

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_env != 'none')
    timeout-minutes: 15
    environment:
      name: ${{ github.event.inputs.deploy_env || 'staging' }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: |
          if npm run build --dry-run > /dev/null 2>&1; then
            npm run build
          else
            echo "No build script found"
          fi

      - name: Deploy to ${{ github.event.inputs.deploy_env || 'staging' }}
        run: |
          echo "🚀 Deploying to ${{ github.event.inputs.deploy_env || 'staging' }}..."
          
          # Add your actual deployment commands here
          # Examples:
          # - scp files to server
          # - docker compose up with new image
          # - kubectl apply -f deployments/
          # - call deployment API
          
          echo "✅ Deployment completed"

      - name: Health check
        run: |
          echo "🏥 Running health check..."
          # Add your health check commands here
          # curl -f https://your-app.com/health
          echo "✅ Health check passed"

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [test, e2e-test, security-scan, deploy]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "📊 Pipeline Results:"
          echo "Tests: ${{ needs.test.result }}"
          echo "E2E Tests: ${{ needs.e2e-test.result }}"
          echo "Security: ${{ needs.security-scan.result }}"
          echo "Deploy: ${{ needs.deploy.result }}"
          
          if [[ "${{ needs.test.result }}" == "failure" || "${{ needs.security-scan.result }}" == "failure" ]]; then
            echo "❌ Pipeline failed - check the logs"
            exit 1
          else
            echo "✅ Pipeline completed successfully"
          fi
