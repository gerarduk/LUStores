# name: LUStores CI/CD Pipeline

on:
  push:
    branches: [ main]

env:
  NODE_VERSION: '24.x'
  REGISTRY: docker.io
  IMAGE_NAME: lustores/lustores
  COMPOSE_PROJECT_NAME: 'lustores'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ============================================================================
  # TESTING AND QUALITY ASSURANCE
  # ============================================================================
  
  test:
    name: Test Suite
    runs-on:  self-hosted   
    strategy:
      matrix:
        node-version: [24.x]
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_USER: testuser
          POSTGRES_DB: lustores_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.npm
          node_modules
          */*/node_modules
        key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-${{ matrix.node-version }}-
          ${{ runner.os }}-node-    

    - name: Install dependencies
      run: npm ci   
    - name: Build Docker Compose images
      run: |
        echo "Building specific services needed for e2e tests..."
        docker compose -f docker-compose.yml -f docker-compose.test-prod.yml build test-db
        docker compose -f docker-compose.yml -f docker-compose.test-prod.yml build replit-auth-staging
        docker compose -f docker-compose.yml -f docker-compose.test-prod.yml build app-staging
        docker compose -f docker-compose.yml -f docker-compose.test-prod.yml build integration-tests
        echo "Listing built images..."
        docker images | grep lustores

    - name: Create test environment file
      run: |
        cat > .env.test << EOF
        NODE_ENV=test
        PORT=3001
        DATABASE_URL=postgresql://testuser:testpassword@localhost:5432/lustores_test
        JWT_SECRET=test-jwt-secret-key-for-ci
        JWT_EXPIRES_IN=1h
        BCRYPT_ROUNDS=10
        CORS_ORIGIN=http://localhost:3000
        API_RATE_LIMIT=1000
        EOF
        #use env file
    - name: set env vars from .env.test
      run: |
        set -o allexport
        source .env.test
        set +o allexport

    - name: Run linting
      run: npm run lint
      continue-on-error: true

    - name: Run type checking
      run: npm run type-check
      continue-on-error: true

    - name: Debug Jest configuration
      run: |
        echo "Current directory: $(pwd)"
        echo "Shared directory contents:"
        ls -la shared/
        echo "Jest configuration:"
        cat jest.config.js
        echo "TypeScript test configuration:"
        cat tsconfig.test.json
        echo "Jest setup file:"
        cat jest.setup.js

    - name: Run unit tests
      run: npm run test:ci
      env:
        DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/lustores_test
        CI: true

    - name: Run integration tests
      run: pwd && ls -lah && npm run test:integration --passWithNoTests
      env:
        DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/lustores_test
        CI: true

    - name: Run e2e tests
      run: npm run test:e2e
      env:
        DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/lustores_test
        CI: true

    - name: Generate test reports
      run: |
        echo "Generating test reports..."
        npm run test:reports
        echo "Test reports generated successfully."
      env:
        DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/lustores

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-node-${{ matrix.node-version }}
        path: |
          test-reports/
          coverage/
          test-reports.html

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      if: matrix.node-version == '24.x'
      with:
        file: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella

  # ============================================================================
  # SECURITY SCANNING
  # ============================================================================
  
  security:
    name: Security Scan
    runs-on:  self-hosted
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies    
      run: npm ci

    - name: Run npm audit
      run: npm audit --audit-level critical
      continue-on-error: true

    # Snyk Security Scan - Commented out for private repo (requires SNYK_TOKEN secret)
    # - name: Run Snyk security scan
    #   uses: snyk/actions/node@master
    #   env:
    #     SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    #   with:
    #     args: --severity-threshold=high
    #   continue-on-error: true

    # CodeQL Analysis - Commented out for private repo (requires GitHub Advanced Security)
    # - name: Initialize CodeQL
    #   uses: github/codeql-action/init@v3
    #   with:
    #     languages: javascript-typescript

    # - name: Perform CodeQL Analysis
    #   uses: github/codeql-action/analyze@v3

  # ============================================================================
  # DOCKER BUILD AND TESTING
  # ============================================================================
  
  docker-build:
    name: Docker Build & Test
    runs-on:  self-hosted
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4    
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Docker Hub login - Commented out for private repo
    # - name: Log in to Docker Hub
    #   uses: docker/login-action@v3
    #   with:
    #     username: ${{ secrets.DOCKERHUB_USERNAME }}
    #     password: ${{ secrets.DOCKERHUB_TOKEN }}
 
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha

    - name: Debug metadata
      run: |
        echo "Generated tags: ${{ steps.meta.outputs.tags }}"
        echo "Generated labels: ${{ steps.meta.outputs.labels }}"   
    - name: Build Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: false
        load: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        target: production
    - name: Build Docker test image
      id: test-image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: false
        load: true
        tags: test-image:latest
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        target: test
    - name: Test Docker image
      run: |
        echo "Available Docker images:"
        docker images
        echo "Running tests with test-image:latest"
        docker run --rm \
          -e NODE_ENV=test \
          -e DATABASE_URL=postgresql://testuser:testpass@localhost/test \
          test-image:latest \
          npm run test:integration

    - name: Run security scan on Docker image
      uses: anchore/scan-action@v6
      with:
        image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}      
        severity-cutoff: medium
        fail-build: false

    # Docker image push - Commented out for private repo (requires Docker Hub credentials)
    # - name: Push Docker image (on main branch)
    #   if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    #   uses: docker/build-push-action@v6
    #   with:
    #     context: .
    #     push: true
    #     tags: ${{ steps.meta.outputs.tags }}
    #     labels: ${{ steps.meta.outputs.labels }}
    #     cache-from: type=gha
    #     cache-to: type=gha,mode=max
    #     target: production

  # ============================================================================
  # PERFORMANCE TESTING
  # ============================================================================
  
  performance:
    name: Performance Tests
    runs-on:  self-hosted
    needs: [test, docker-build]
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_USER: testuser
          POSTGRES_DB: lustores_perf
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install k6
      run: |
        sudo gpg -k
        sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
        echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
        sudo apt-get update
        sudo apt-get install k6

    - name: Start application for performance testing
      run: |
        npm run start:test &
        sleep 10
      env:
        NODE_ENV: test
        DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/lustores_perf

    - name: Run performance tests
      run: npm run test:performance
      continue-on-error: true

    - name: Upload performance results
      uses: actions/upload-artifact@v4
      with:
        name: performance-results
        path: performance-results/

  # ============================================================================
  # STAGING DEPLOYMENT
  # ============================================================================
  
  deploy-staging:
    name: Deploy to Staging
    runs-on:  self-hosted
    needs: [test, security, docker-build]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to staging environment
      run: |
