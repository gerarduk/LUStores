# Kubernetes Kafka Deployment Setup - Multi-Node Ready
# This manifest is designed to span multiple nodes in your cluster
# Add this to your kube.yml or create separate kafka-deployment.yml

---

# Namespace already created in main kube.yml
# namespace: lustores

---

# ===================================
# STORAGE CLASS - Multi-Node Support
# ===================================
# Choose one of these based on your infrastructure:

# Option 1: Local Storage (for single node or node-local storage)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fast-local-storage
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer

---

# Option 2: Standard Storage (if you have NFS or cloud storage)
# apiVersion: storage.k8s.io/v1
# kind: StorageClass
# metadata:
#   name: fast-local-storage
# provisioner: nfs.io/nfs
# parameters:
#   server: "nfs-server.example.com"
#   path: "/exports/kafka"

---

# Option 3: Cloud Storage (AWS EBS example)
# apiVersion: storage.k8s.io/v1
# kind: StorageClass
# metadata:
#   name: fast-local-storage
# provisioner: ebs.csi.aws.com
# parameters:
#   type: gp3
#   iops: "3000"
#   throughput: "125"

---

# ===================================
# ZOOKEEPER - Kafka Coordination
# ===================================

# PersistentVolumeClaim for Zookeeper (dynamic provisioning)
# One per node - Kubernetes will create PVs automatically
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zookeeper-pvc-0
  namespace: lustores
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-local-storage
  resources:
    requests:
      storage: 5Gi

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zookeeper-pvc-1
  namespace: lustores
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-local-storage
  resources:
    requests:
      storage: 5Gi

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zookeeper-pvc-2
  namespace: lustores
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-local-storage
  resources:
    requests:
      storage: 5Gi

---

# Keep the old PersistentVolume definitions for reference
# (only needed if using hostPath on specific nodes)
# 
# apiVersion: v1
# kind: PersistentVolume
# metadata:
#   name: zookeeper-pv
#   namespace: lustores
#   labels:
#     node: worker-1
# spec:
#   capacity:
#     storage: 5Gi
#   accessModes:
#     - ReadWriteOnce
#   storageClassName: fast-local-storage
#   hostPath:
#     path: /mnt/data/zookeeper

---

# ConfigMap for Zookeeper Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: zookeeper-config
  namespace: lustores
data:
  zookeeper.properties: |
    tickTime=2000
    dataDir=/var/lib/zookeeper
    clientPort=2181
    initLimit=5
    syncLimit=2
    server.1=zookeeper-0.zookeeper:2888:3888
    server.2=zookeeper-1.zookeeper:2888:3888
    server.3=zookeeper-2.zookeeper:2888:3888
    autopurge.snapRetainCount=3
    autopurge.purgeInterval=24

---

# StatefulSet for Zookeeper
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: lustores
spec:
  serviceName: zookeeper
  replicas: 3
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      # Pod Anti-Affinity: Spread across different nodes
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - zookeeper
              topologyKey: kubernetes.io/hostname
        # Optional: Node affinity to run on specific node types
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            # Change "worker" to match your node labels
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/worker
                    operator: In
                    values:
                      - "true"
      
      terminationGracePeriodSeconds: 30
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.5.0
          ports:
            - containerPort: 2181
              name: client
            - containerPort: 2888
              name: server
            - containerPort: 3888
              name: leader-election
          env:
            - name: ZOO_CFG_EXTRA
              value: "metricsProvider.className=org.apache.zookeeper.metrics.prometheus.PrometheusMetricsProvider metricsProvider.httpPort=8080"
            - name: ZOO_DATA_DIR
              value: "/var/lib/zookeeper/data"
            - name: ZOO_LOG_DIR
              value: "/var/log/zookeeper"
            - name: ZOO_MY_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
                  path: /var/lib/zookeeper/data/myid
          volumeMounts:
            - name: zookeeper-data
              mountPath: /var/lib/zookeeper/data
            - name: zookeeper-config
              mountPath: /etc/kafka/secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - echo ruok | nc localhost 2181
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - echo stat | nc localhost 2181
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: zookeeper-config
          configMap:
            name: zookeeper-config
  
  # Dynamic PVC management per replica
  volumeClaimTemplates:
    - metadata:
        name: zookeeper-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: fast-local-storage
        resources:
          requests:
            storage: 5Gi

---

# Headless Service for Zookeeper
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: lustores
spec:
  clusterIP: None
  selector:
    app: zookeeper
  ports:
    - port: 2181
      targetPort: 2181
      name: client
    - port: 2888
      targetPort: 2888
      name: server
    - port: 3888
      targetPort: 3888
      name: leader-election
    - port: 8080
      targetPort: 8080
      name: metrics

---

# ===================================
# KAFKA - Message Broker
# ===================================

# PersistentVolumeClaims for Kafka Brokers (dynamic)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-pvc-0
  namespace: lustores
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-local-storage
  resources:
    requests:
      storage: 20Gi

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-pvc-1
  namespace: lustores
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-local-storage
  resources:
    requests:
      storage: 20Gi

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-pvc-2
  namespace: lustores
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: fast-local-storage
  resources:
    requests:
      storage: 20Gi

---

# ConfigMap for Kafka Topics
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-topics-config
  namespace: lustores
data:
  create-topics.sh: |
    #!/bin/bash
    set -e
    
    echo "Waiting for Kafka brokers to be ready..."
    sleep 10
    
    # Create topics
    kafka-topics --create --if-not-exists --bootstrap-server kafka-0.kafka:9092 --topic orders.created --partitions 3 --replication-factor 3 --config retention.ms=604800000
    kafka-topics --create --if-not-exists --bootstrap-server kafka-0.kafka:9092 --topic orders.updated --partitions 3 --replication-factor 3 --config retention.ms=604800000
    kafka-topics --create --if-not-exists --bootstrap-server kafka-0.kafka:9092 --topic inventory.reserved --partitions 3 --replication-factor 3 --config retention.ms=604800000
    kafka-topics --create --if-not-exists --bootstrap-server kafka-0.kafka:9092 --topic inventory.released --partitions 3 --replication-factor 3 --config retention.ms=604800000
    kafka-topics --create --if-not-exists --bootstrap-server kafka-0.kafka:9092 --topic quotes.created --partitions 3 --replication-factor 3 --config retention.ms=604800000
    kafka-topics --create --if-not-exists --bootstrap-server kafka-0.kafka:9092 --topic quotes.processed --partitions 3 --replication-factor 3 --config retention.ms=604800000
    kafka-topics --create --if-not-exists --bootstrap-server kafka-0.kafka:9092 --topic sales.completed --partitions 3 --replication-factor 3 --config retention.ms=2592000000
    kafka-topics --create --if-not-exists --bootstrap-server kafka-0.kafka:9092 --topic notifications.email --partitions 3 --replication-factor 3 --config retention.ms=86400000
    kafka-topics --create --if-not-exists --bootstrap-server kafka-0.kafka:9092 --topic audit.logs --partitions 1 --replication-factor 3 --config retention.ms=7776000000
    
    echo "All topics created successfully"

---

# StatefulSet for Kafka
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: lustores
spec:
  serviceName: kafka
  replicas: 3
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      # Pod Anti-Affinity: Spread Kafka brokers across different nodes
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - kafka
              topologyKey: kubernetes.io/hostname  # Each pod on different node
        # Optional: Node affinity for worker nodes
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/worker
                    operator: In
                    values:
                      - "true"
      
      terminationGracePeriodSeconds: 30
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.5.0
          ports:
            - containerPort: 9092
              name: plaintext
            - containerPort: 29092
              name: plaintext-internal
            - containerPort: 9999
              name: jmx
          env:
            # Broker ID auto-generated from pod ordinal
            - name: KAFKA_BROKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
                  path: /var/run/secrets/pod_ordinal.txt
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "zookeeper-0.zookeeper:2181,zookeeper-1.zookeeper:2181,zookeeper-2.zookeeper:2181"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://$(POD_NAME).kafka:29092,PLAINTEXT_HOST://$(POD_IP):9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_DELETE_TOPIC_ENABLE
              value: "true"
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "168"  # 7 days
            - name: KAFKA_LOG_RETENTION_BYTES
              value: "1073741824"  # 1GB per partition
            - name: KAFKA_NUM_PARTITIONS
              value: "3"
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: "2"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: KAFKA_JMX_PORT
              value: "9999"
            - name: KAFKA_JMX_HOSTNAME
              value: "$(POD_NAME).kafka"
            - name: KAFKA_CONFLUENT_METRICS_ENABLE
              value: "false"
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1"
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - kafka-broker-api-versions.sh --bootstrap-server localhost:9092 | grep ApiVersion
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
  
  # Dynamic PVC per replica (volumeClaimTemplates)
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: fast-local-storage
        resources:
          requests:
            storage: 20Gi

---

# Headless Service for Kafka
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: lustores
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
    - port: 9092
      targetPort: 9092
      name: plaintext
    - port: 29092
      targetPort: 29092
      name: plaintext-internal
    - port: 9999
      targetPort: 9999
      name: jmx

---

# Client Service for Kafka (for external connections)
apiVersion: v1
kind: Service
metadata:
  name: kafka-client
  namespace: lustores
spec:
  selector:
    app: kafka
  type: ClusterIP
  ports:
    - port: 9092
      targetPort: 9092
      name: plaintext

---

# Job to Create Topics
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics-init
  namespace: lustores
spec:
  template:
    spec:
      serviceAccountName: default
      containers:
        - name: kafka-topics
          image: confluentinc/cp-kafka:7.5.0
          command: ["/bin/bash"]
          args:
            - -c
            - |
              echo "Waiting for Kafka to be ready..."
              for i in {1..60}; do
                if kafka-broker-api-versions.sh --bootstrap-server kafka-0.kafka:9092 2>/dev/null; then
                  echo "Kafka is ready!"
                  break
                fi
                echo "Attempt $i: Waiting..."
                sleep 5
              done
              
              # Create all topics
              kafka-topics --create --if-not-exists --bootstrap-server kafka-0.kafka:9092 --topic orders.created --partitions 3 --replication-factor 3 --config retention.ms=604800000
              kafka-topics --create --if-not-exists --bootstrap-server kafka-0.kafka:9092 --topic orders.updated --partitions 3 --replication-factor 3 --config retention.ms=604800000
              kafka-topics --create --if-not-exists --bootstrap-server kafka-0.kafka:9092 --topic inventory.reserved --partitions 3 --replication-factor 3 --config retention.ms=604800000
              kafka-topics --create --if-not-exists --bootstrap-server kafka-0.kafka:9092 --topic inventory.released --partitions 3 --replication-factor 3 --config retention.ms=604800000
              kafka-topics --create --if-not-exists --bootstrap-server kafka-0.kafka:9092 --topic quotes.created --partitions 3 --replication-factor 3 --config retention.ms=604800000
              kafka-topics --create --if-not-exists --bootstrap-server kafka-0.kafka:9092 --topic quotes.processed --partitions 3 --replication-factor 3 --config retention.ms=604800000
              kafka-topics --create --if-not-exists --bootstrap-server kafka-0.kafka:9092 --topic sales.completed --partitions 3 --replication-factor 3 --config retention.ms=2592000000
              kafka-topics --create --if-not-exists --bootstrap-server kafka-0.kafka:9092 --topic notifications.email --partitions 3 --replication-factor 3 --config retention.ms=86400000
              kafka-topics --create --if-not-exists --bootstrap-server kafka-0.kafka:9092 --topic audit.logs --partitions 1 --replication-factor 3 --config retention.ms=7776000000
              
              echo "Topics created successfully"
              kafka-topics --list --bootstrap-server kafka-0.kafka:9092
      restartPolicy: OnFailure
  backoffLimit: 10

---

# ===================================
# KAFKA UI - Optional Monitoring
# ===================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: lustores
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
        - name: kafka-ui
          image: provectuslabs/kafka-ui:latest
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: lustores
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: "kafka-0.kafka:9092,kafka-1.kafka:9092,kafka-2.kafka:9092"
            - name: KAFKA_CLUSTERS_0_ZOOKEEPER
              value: "zookeeper-0.zookeeper:2181,zookeeper-1.zookeeper:2181,zookeeper-2.zookeeper:2181"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---

# Service for Kafka UI
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: lustores
spec:
  selector:
    app: kafka-ui
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP

---

