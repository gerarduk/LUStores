# SSL/HTTPS Docker Compose Override
# Use with: docker-compose -f docker-compose.yml -f docker-compose.ssl.yml up -d

services:
  # Nginx reverse proxy with SSL termination
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/error-502.html:/etc/nginx/error-502.html:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Certbot for Let's Encrypt certificate management
  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped
    profiles:
      - ssl

  # Update app service for HTTPS
  app:
    ports:
      # Remove external port exposure - nginx will handle it
      - "5000"  # Internal only
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=postgresql://postgres:password@db:5432/university_inventory
      - SESSION_SECRET=${SESSION_SECRET:-your-secret-key-here}
      - HTTPS=${HTTPS:-true}
      - FORCE_HTTPS=${FORCE_HTTPS:-true}
      - DOMAIN=${DOMAIN:-localhost}
      - REPL_ID=local-dev-repl
      - REPLIT_DOMAINS=${DOMAIN:-localhost}
      - ISSUER_URL=http://replit-auth:3001/oidc
    networks:
      - default
